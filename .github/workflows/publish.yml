# Publish a package to npm from CI, with a provenance statement.
#
# Publishing from a laptop is not an option: the n8n verification guidelines require,
# from 1 May 2026, that verified nodes are published by a GitHub Action with provenance.
# Provenance needs `id-token: write` here, a public repo, and a `repository` field in
# package.json that points back at this repo — all three, or npm rejects the attestation.
#
# Auth is trusted publishing (OIDC): there is no npm token anywhere. Two consequences
# that are easy to get wrong:
#
#   - `setup-node` must NOT be given `registry-url`. It writes an .npmrc pointing at
#     NODE_AUTH_TOKEN, and npm then fails with ENEEDAUTH instead of falling back to
#     OIDC (npm/documentation#1960).
#   - The trusted publisher on npmjs is matched by workflow *filename*. Renaming this
#     file breaks publishing, silently, until someone reads the auth error.
#
# Each package's `publishConfig` carries `access: public` and `provenance: true`, so a
# local `npm publish` behaves the same way — minus the provenance, which needs CI.
#
# A package must exist on the registry before a trusted publisher can be configured for
# it, so a brand-new name still needs one manual first publish (npm/cli#8544).
#
# Version bumps are manual for now. Issue #6 replaces this with the real pipeline once
# the workspace exists.

name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to publish
        required: true
        type: choice
        options:
          - packages/n8n-nodes-nibify
          - packages/sdk-ts
      dry_run:
        description: Dry run — pack and validate, publish nothing
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1; the version bundled with Node is older
      # often enough that pinning it here is cheaper than debugging an auth error.
      - run: npm install -g npm@latest

      - name: Publish
        working-directory: ${{ inputs.package }}
        run: npm publish ${{ inputs.dry_run && '--dry-run' || '' }}
