# The same four checks the private repo runs, on the same configs — which is the
# point: `tsconfig.base.json`, `eslint.config.mjs` and `.prettierrc.json` are
# copied here verbatim rather than published as a package, so the only thing that
# keeps the two halves from drifting is that both actually run them.
#
# No `pnpm test` step yet: nothing here has tests. It arrives with the catalog,
# which brings its own `node --test` suite.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version pinned: it reads `packageManager` from package.json, which is
      # the same thing that pins pnpm locally.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check
