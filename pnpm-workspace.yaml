packages:
  - 'packages/*'
  # Not here yet. The catalog is written in the private repo — same path, same
  # package name — so the move is a straight copy and this line is already right
  # when it lands. A glob that matches nothing is not an error for pnpm.
  - 'catalog'

# Native addons n8n-workflow pulls in for its own runtime. The node needs its types
# and a handful of constants, never a compiled sandbox.
allowBuilds:
  cpu-features: false
  isolated-vm: false
  ssh2: false
